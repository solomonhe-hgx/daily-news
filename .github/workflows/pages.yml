name: Deploy daily news to GitHub Pages

# Publishes the latest classroom-ready web deck.
on:
  push:
    branches: [main]
    paths:
      - "daily-news/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-news
  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Verify artifact and deploy Pages
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        timeout-minutes: 12
        env:
          PAGES_ARTIFACT_ID: ${{ needs.upload.outputs.artifact_id }}
        with:
          debug: false
          retries: 0
          script: |
            const pause = () => new Promise(resolve => setTimeout(resolve, 5000));
            const failed = new Set([
              'deployment_failed',
              'deployment_perms_error',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost'
            ]);
            let phase = '准备';
            try {
              if (Number(process.env.GITHUB_RUN_ATTEMPT || '1') > 1) {
                core.setFailed('此任务已执行过；请先确认已有部署状态，不自动重复创建');
                return;
              }
              const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
              if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
                core.setFailed('上传作业没有返回有效产物ID；未创建部署');
                return;
              }

              phase = '核验已上传产物';
              let artifact;
              for (let attempt = 0; attempt < 6; attempt++) {
                try {
                  const response = await github.request('GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                    ...context.repo,
                    artifact_id: artifactId,
                    request: { timeout: 15000 }
                  });
                  artifact = response.data;
                  break;
                } catch (error) {
                  if (error.status !== 404 || attempt === 5) throw error;
                  await pause();
                }
              }
              if (Number(artifact.id) !== artifactId || artifact.name !== 'github-pages' || artifact.expired !== false || !(artifact.size_in_bytes > 0)) {
                core.setFailed('上传产物的ID、名称、有效期或大小不符合要求；未创建部署');
                return;
              }
              if (String(artifact.workflow_run?.id) !== String(context.runId) || artifact.workflow_run?.head_sha !== context.sha) {
                core.setFailed('产物不属于当前工作流运行及提交；未创建部署');
                return;
              }
              core.info(`产物已核验：ID ${artifact.id}，${artifact.size_in_bytes}字节`);

              phase = 'OIDC验证';
              const oidcToken = await core.getIDToken();
              core.setSecret(oidcToken);

              phase = '创建部署';
              const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
                request: { timeout: 30000 }
              });
              if (deployment.id == null || typeof deployment.page_url !== 'string') {
                core.setFailed('创建部署的响应不完整；不得自动重复创建');
                return;
              }

              const deploymentId = String(deployment.id);
              core.info(`Pages部署ID：${deploymentId}`);
              phase = '查询部署状态';
              const deadline = Date.now() + 600000;
              let errors = 0;
              while (Date.now() < deadline) {
                let status;
                try {
                  const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                    ...context.repo,
                    deploymentId,
                    request: { timeout: 15000 }
                  });
                  status = data.status;
                  if (typeof status !== 'string') {
                    core.setFailed(`部署${deploymentId}的状态响应缺少status字段；未重复创建`);
                    return;
                  }
                  core.info(`Pages部署状态：${status}`);
                  errors = 0;
                } catch (error) {
                  if (error.name === 'TypeError') throw error;
                  core.warning(`只读状态查询失败（HTTP ${Number(error.status) || '未知'}）`);
                  if (++errors >= 10) {
                    core.setFailed(`部署${deploymentId}连续查询失败；远端状态未知`);
                    return;
                  }
                  await pause();
                  continue;
                }
                if (status === 'succeed') {
                  core.setOutput('page_url', deployment.page_url);
                  core.info(`发布成功：${deployment.page_url}`);
                  return;
                }
                if (failed.has(status)) {
                  core.setFailed(`部署${deploymentId}失败：${status}`);
                  return;
                }
                await pause();
              }
              core.setFailed(`部署${deploymentId}监测超时；远端状态未知，未取消或重复创建`);
            } catch (error) {
              core.setFailed(`${phase}失败（HTTP ${Number(error.status) || '未知'}，${error.name || 'Error'}）；未重试创建`);
            }
